<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="styles.css" />

  <body style="border-color: #d5d5d9">
    <form
      style="
        border-color: #e6e6e6;
        margin: 200px;
        border-radius: 16px;
        display: flex;
        justify-content: space-around;

      <seciton>
        <h1>ព៍ត័មានផ្ទាល់ខ្លួន</h1>

        <label for="name">គោត្ដនាម​ និងនាម</label>
        <br />
        <input
          style="margin-bottom: 20px; width: 434px"
          placeholder="ឯក ឧត្ដម"
          type="text"
          name="name"
          id="name"
          required
        />

        <br />

        <label for="name">គោត្ដនាម​ និងនាម (ភាសាអង់គ្លេស)</label>
        <br />
        <input
          style="margin-bottom: 20px; width: 434px"
          placeholder="Aek Oudom"
          type="text"
          name="eng-name"
          id="eng-name"
          required
        />

        <br />

        <label for="gender">ភេទ</label>
        <br />
        <select name="gender" id="gender" required style="margin-bottom: 20px">
          <option value="" selected disabled>ភេទ</option>
          <option value="male">ប្រុស</option>
          <option value="female">ស្រី</option>
        </select>

        <br />

        <label for="dateOfBirth">ថ្ងៃខែឆ្នាំកំណើត</label>
        <br />
        <input
          style="width: 140px"
          type="number"
          name="birthDay"
          id="birthDay"
          placeholder="ថ្ងៃទី"
        />

        <select name="birthMonth" id="birthMonth">
          <option value="month" disabled selected>ខែ</option>
          <option value="jan">មករា</option>
          <option value="feb">កុម្ភ:</option>
          <option value="mar">មីនា</option>
          <option value="apr">មេសា</option>
          <option value="may">ឧសភា</option>
          <option value="jun">មិថុនា</option>
          <option value="jul">កក្កដា</option>
          <option value="aug">សីហា</option>
          <option value="sep">កញ្ញា</option>
          <option value="oct">តុលា</option>
          <option value="nov">វិច្ឆិកា</option>
          <option value="dec">ធ្នូ</option>
        </select>

        <input
          style="margin-bottom: 20px; width: 140px"
          type="number"
          name="birthYear"
          id="birthYear"
          placeholder="ឆ្នាំ"
        />

        <br />

        <label for="placeOfBirth">ទីកន្លែងកំណើត</label>
        <br />
        <select
          style="margin-bottom: 20px"
          name="placeOfBirth"
          id="placeOfBirth"
        >
          <option value="" selected disabled>សូមជ្រើសរើសខេត្ត/ក្រុង</option>
          <option value="ភ្នំពេញ">រាជធានី ភ្នំពេញ</option>
          <option value="បន្ទាយមានជ័យ">ខេត្ត បន្ទាយមានជ័យ</option>
          <option value="បាត់ដំបង">ខេត្ត បាត់ដំបង</option>
          <option value="កំពង់ចាម">ខេត្ត កំពង់ចាម</option>
          <option value="កំពង់ឆ្នាំង">ខេត្ត កំពង់ឆ្នាំង</option>
          <option value="កំពង់ស្ពឺ">ខេត្ត កំពង់ស្ពឺ</option>
          <option value="កំពង់ធំ">ខេត្ត កំពង់ធំ</option>
          <option value="កំពត">ខេត្ត កំពត</option>
          <option value="កណ្ដាល">ខេត្ត កណ្ដាល</option>
          <option value="កោះកុង">ខេត្ត កោះកុង</option>
          <option value="ក្រចេះ">ខេត្ត ក្រចេះ</option>
          <option value="មណ្ឌលគិរី">ខេត្ត មណ្ឌលគិរី</option>
          <option value="ឧត្តរមានជ័យ">ខេត្ត ឧត្តរមានជ័យ</option>
          <option value="ប៉ៃលិន">ខេត្ត ប៉ៃលិន</option>
          <option value="ព្រះសីហនុ">ខេត្ត ព្រះសីហនុ</option>
          <option value="ព្រះវិហារ">ខេត្ត ព្រះវិហារ</option>
          <option value="ព្រៃវែង">ខេត្ត ព្រៃវែង</option>
          <option value="ពោធិ៍សាត់">ខេត្ត ពោធិ៍សាត់</option>
          <option value="រតនគិរី">ខេត្ត រតនគិរី</option>
          <option value="សៀមរាប">ខេត្ត សៀមរាប</option>
          <option value="ស្ទឹងត្រែង">ខេត្ត ស្ទឹងត្រែង</option>
          <option value="ស្វាយរៀង">ខេត្ត ស្វាយរៀង</option>
          <option value="តាកែវ">ខេត្ត តាកែវ</option>
          <option value="ត្បូងឃ្មុំ">ខេត្ត ត្បូងឃ្មុំ</option>
          <option value="កែប">ខេត្ត កែប</option>
        </select>

        <br />

        <label for="tel">លេខទូរស័ព្ទ ទំនាក់ទំនង (Telegram)</label>
        <br />
        <input
          style="margin-bottom: 20px; width: 434px"
          type="tel"
          name="telephone"
          id="telephone"
          placeholder="012345678"
          required
        />

        <br />

        <label for="shift">វេនសិក្សា</label>
        <br />
        <select name="shift" id="shift" required>
          <option value="" selected disabled>សូមជ្រើសរើសវេនសិក្សា</option>
          <option value="morning">ព្រឹក</option>
          <option value="afternoon">រសៀល</option>
          <option value="evening">ល្ងាច</option>
        </select>
      </seciton>

      <div style="border-left: 2px solid #d6d6d6; height: 1000px"></div>

            <input
              class="small-input"

              name="fatherTelephone"
              id="fatherTelephone"
              placeholder="012345678"

            </select>
          </div>
        </div>
